<!doctype html><html lang="bn"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Japanova Reel Maker</title><style>*{box-sizing:border-box}body{margin:0;background:#eef1f6;color:#142238;font:16px system-ui,sans-serif}header{background:#142238;color:white;padding:20px 5%;font-weight:800}main{max-width:1100px;margin:24px auto;display:grid;grid-template-columns:1fr 340px;gap:24px;padding:16px}section{background:white;padding:24px;border-radius:18px}label{display:block;font-weight:700;margin:16px 0 6px}input,textarea,select,button{font:inherit;width:100%;padding:12px;border:1px solid #ccd3df;border-radius:9px}textarea{height:180px}button{background:#c91d3c;color:white;border:0;font-weight:bold;cursor:pointer;margin-top:12px}button:disabled{opacity:.5}canvas{width:100%;border-radius:12px;background:#142238}small{color:#56647a}progress{width:100%}a{display:block;margin-top:12px}a[hidden]{display:none} @media(max-width:760px){main{grid-template-columns:1fr}canvas{max-width:320px}}</style><header>JAPANOVA EDU / Reel Studio</header><main><section><h1>৩০ সেকেন্ডের রিল তৈরি করুন</h1><small>Offline • HD Studio • Adjustable export quality</small><label>স্ক্রিপ্ট (সম্পূর্ণ বাক্য লিখুন)</label><textarea id="script">জাপানে উচ্চশিক্ষার স্বপ্ন দেখছেন? এখন থেকেই জাপানি ভাষা শেখা শুরু করুন। COE ও ভিসার প্রয়োজনীয় ডকুমেন্ট প্রস্তুত রাখুন। নিয়মিত ভাষা অনুশীলন করুন। বিস্তারিত জানতে Japanova Edu ফলো করুন।</textarea><label>ব্র্যান্ডের নাম</label><input id="brand" value="JAPANOVA EDU" maxlength="40"><label>ব্যাকগ্রাউন্ড (ঐচ্ছিক ছবি বা ভিডিও)</label><input id="media" type="file" accept="image/*,video/*"><label>মিউজিক (ঐচ্ছিক, নিজের লাইসেন্সযুক্ত অডিও)</label><input id="music" type="file" accept="audio/*"><label>ভিডিও কোয়ালিটি</label><select id="quality"><option value="lite">Lite — 540 × 960 / 15 FPS</option><option value="hd" selected>HD — 720 × 1280 / 24 FPS</option><option value="full">Full HD — 1080 × 1920 / 30 FPS</option></select><label>থিম</label><select id="theme"><option value="red">Japan Red</option><option value="blue">Midnight Blue</option></select><button id="split" type="button">Auto split sentences</button><div id="editor"></div><small id="total"></small><button id="preview">Preview</button><button id="export">Generate & Export 30s Reel</button><progress id="progress" max="30" value="0"></progress><p id="status" role="status"></p><a id="download" hidden>ভিডিও সেভ করুন</a><small>ভিডিও তৈরি হওয়ার সময় এই ট্যাব খোলা রাখুন। MP4 CPU rendering • preview uses browser.</small></section><section><canvas id="canvas" width="540" height="960"></canvas></section></main><script>
const $=id=>document.getElementById(id),c=$('canvas'),ctx=c.getContext('2d');let durations=[],source=null, scenes=[],bg=null,bgURL=null,raf=0,locked=false,outURL=null;const W=1080,H=1920;const presets={lite:[540,960,15,2000000],hd:[720,1280,24,5000000],full:[1080,1920,30,10000000]};let fps=24,bitrate=5000000;function quality(){let [w,h,f,b]=presets[$('quality').value];c.width=w;c.height=h;ctx.setTransform(w/W,0,0,h/H,0,0);fps=f;bitrate=b;}quality();$('quality').onchange=()=>{cancelAnimationFrame(raf);if(bg instanceof HTMLVideoElement)bg.pause();prepare();quality();draw(0);};
function prepare(force=false){let raw=$('script').value.trim();if(!raw)throw Error('স্ক্রিপ্ট দিন।');if(!force&&source===raw)return;let parts=raw.match(/[^।!?\n]+[।!?]*|[।!?]+/gu)||[];scenes=parts.map(x=>x.trim()).filter(Boolean);if(scenes.length>20)throw Error('সর্বোচ্চ ২০টি বাক্য দিন।');let weights=scenes.map(x=>Math.max(1,x.split(/\s+/).length));let sum=weights.reduce((a,b)=>a+b,0);durations=weights.map(w=>1+(30-scenes.length)*w/sum);source=raw;editor();}
function editor(){let root=$('editor');root.replaceChildren();scenes.forEach((s,i)=>{let row=document.createElement('div');let label=document.createElement('label');label.textContent='Scene '+(i+1);let t=document.createElement('textarea');t.style.height='75px';t.value=s;t.oninput=()=>{scenes[i]=t.value;draw(0)};let d=document.createElement('input');d.type='number';d.min='0.5';d.step='0.1';d.value=durations[i].toFixed(2);d.onchange=()=>{durations[i]=Math.max(.5,Number(d.value)||.5);total()};row.append(label,t,d);root.append(row)});total()}
function total(){ $('total').textContent='Scene weights: '+durations.reduce((a,b)=>a+b,0).toFixed(2)+' s • automatically normalized to 30 s';}
function timing(){let sum=durations.reduce((a,b)=>a+b,0);let frames=30*fps;let acc=0,last=0;return durations.map((d,i)=>{acc+=d/sum*frames;let end=i===durations.length-1?frames:Math.round(acc);let n=end-last;last=end;return n/fps})}
$('split').onclick=()=>{try{prepare(true);draw(0)}catch(e){$('status').textContent=e.message}};
function lines(s,max){let arr=[],line='';for(let word of s.split(/\s+/)){let next=line?line+' '+word:word;if(ctx.measureText(next).width>max&&line){arr.push(line);line=word}else line=next}if(line)arr.push(line);return arr;}
let overlayOnly=false, textOnly=false,baseOnly=false; function draw(t){let accent=$('theme').value==='red'?'#e32646':'#438bff';let g=ctx.createLinearGradient(0,0,W,H);g.addColorStop(0,'#10233f');g.addColorStop(1,'#080d19');ctx.clearRect(0,0,W,H);if(!overlayOnly){ctx.fillStyle=g;ctx.fillRect(0,0,W,H);}if(overlayOnly){ctx.fillStyle='#081322a8';ctx.fillRect(0,0,W,H)}else if(bg){let w=bg.videoWidth||bg.naturalWidth,h=bg.videoHeight||bg.naturalHeight;if(w&&h){let scale=Math.max(W/w,H/h)*(1+0.04*t/30);ctx.drawImage(bg,(W-w*scale)/2,(H-h*scale)/2,w*scale,h*scale);ctx.fillStyle='#081322a8';ctx.fillRect(0,0,W,H)}}else{ctx.fillStyle=accent;ctx.beginPath();ctx.arc(800,460,190,0,Math.PI*2);ctx.fill();ctx.fillStyle='#253e59';ctx.beginPath();ctx.moveTo(0,1250);ctx.lineTo(560,560);ctx.lineTo(1080,1250);ctx.fill();ctx.fillStyle='#e8edf5';ctx.beginPath();ctx.moveTo(560,560);ctx.lineTo(720,775);ctx.lineTo(560,735);ctx.lineTo(420,755);ctx.fill();ctx.fillStyle='#08132288';ctx.fillRect(0,0,W,H)}ctx.textAlign='center';ctx.fillStyle='white';ctx.font='bold 48px Arial';ctx.fillText($('brand').value,W/2,170,900);ctx.fillStyle=accent;ctx.fillRect(90,210,900,10);let ds=timing(),i=0,start=0;while(i<ds.length-1&&t>=start+ds[i]){start+=ds[i++]}let d=ds[i],local=t-start;if(textOnly)ctx.clearRect(0,0,W,H);ctx.fillStyle='#ffffff';ctx.font='bold 72px "Noto Sans Bengali", "Nirmala UI", sans-serif';let ls=lines(scenes[i]||'',880);let size=72;while((ls.length*size*1.44>1000||ls.some(l=>ctx.measureText(l).width>880))&&size>8){size-=4;ctx.font=`bold ${size}px "Noto Sans Bengali", "Nirmala UI", sans-serif`;ls=lines(scenes[i],880)}ctx.globalAlpha=textOnly?1:Math.max(0,Math.min(1,local/.25,(d-local)/.25));let y=960-(ls.length-1)*size*.72+0;if(!baseOnly)ls.forEach((l,j)=>ctx.fillText(l,W/2,y+j*size*1.44,880));ctx.globalAlpha=1;if(textOnly)return;ctx.fillStyle=accent;ctx.fillRect(90,1550,900*Math.min(1,t/30),12);ctx.fillStyle='white';ctx.font='bold 40px Arial';ctx.fillText('FOLLOW FOR MORE',W/2,1650);ctx.font='32px Arial';ctx.fillText(`${i+1} / ${scenes.length}`,W/2,1720);}
$('media').onchange=async()=>{if(bg instanceof HTMLVideoElement)bg.pause();if(bgURL)URL.revokeObjectURL(bgURL);bg=null;let f=$('media').files[0];if(!f)return;bgURL=URL.createObjectURL(f);let el=f.type.startsWith('video')?document.createElement('video'):new Image();if(el instanceof HTMLVideoElement){el.muted=true;el.loop=true;el.playsInline=true;el.onloadeddata=()=>{bg=el;draw(0)}}else el.onload=()=>{bg=el;draw(0)};el.src=bgURL;};
function play(done){cancelAnimationFrame(raf);if(bg instanceof HTMLVideoElement){bg.currentTime=0;bg.play().catch(()=>{})}let start=performance.now(),last=-100;function tick(now){let t=Math.min(30,(now-start)/1000);if(now-last>=1000/fps-2||t===30){draw(t);last=now-((now-last)%(1000/fps));}$('progress').value=t;if(t<30)raf=requestAnimationFrame(tick);else{if(bg instanceof HTMLVideoElement)bg.pause();done?.()}}raf=requestAnimationFrame(tick)}
$('preview').onclick=()=>{try{prepare();$('status').textContent='Preview চলছে';play(()=>{$('status').textContent='Preview শেষ'})}catch(e){$('status').textContent=e.message}};
$('export').onclick=async()=>{if(locked)return;try{prepare();locked=true;cancelAnimationFrame(raf);if(bg instanceof HTMLVideoElement)bg.pause();for(let el of document.querySelectorAll('input,textarea,select,button'))el.disabled=true;quality();let fd=new FormData(),media=$('media').files[0],music=$('music').files[0];fd.append('settings',JSON.stringify({quality:$('quality').value,count:scenes.length,durations:timing()}));if(media)fd.append('media',media);if(music)fd.append('music',music);overlayOnly=!!media;baseOnly=true;draw(0);baseOnly=false;let base=await new Promise(r=>c.toBlob(r,'image/png'));fd.append('base',base,'base.png');textOnly=true;let elapsed=0;for(let i=0;i<scenes.length;i++){draw(elapsed+timing()[i]/2);elapsed+=timing()[i];let blob=await new Promise(r=>c.toBlob(r,'image/png'));if(!blob)throw Error('Frame generation failed');fd.append('scene'+i,blob,'scene.png');}textOnly=false;overlayOnly=false;draw(0);$('status').textContent='CPU দিয়ে MP4 তৈরি হচ্ছে। অপেক্ষা করুন…';$('download').hidden=true;let res=await fetch('/render',{method:'POST',body:fd});if(!res.ok)throw Error('FFmpeg export failed: '+(await res.text()).replace(/<[^>]*>/g,' ').slice(-1000));if(outURL)URL.revokeObjectURL(outURL);outURL=URL.createObjectURL(await res.blob());$('download').href=outURL;$('download').download='japanova-reel.mp4';$('download').hidden=false;$('progress').value=30;$('status').textContent='MP4 প্রস্তুত। নিচের লিংকে ক্লিক করুন।';}catch(e){$('status').textContent=e.message}finally{baseOnly=false;textOnly=false;overlayOnly=false;locked=false;for(let el of document.querySelectorAll('input,textarea,select,button'))el.disabled=false}};prepare();draw(0);</script></html>
